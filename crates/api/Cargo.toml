[package]
name = "api"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
app-core = { version = "0.1.0", path = "../core" }
askama = "0.16.0"
auth = { version = "0.1.0", path = "../auth" }
axum = { version = "0.8.9", features = ["ws", "multipart"] }
axum-extra = { version = "0.12.6", features = ["cookie", "typed-header"] }
chrono = { version = "0.4.45", features = ["serde"] }
cookie = "0.18.2"
domain = { version = "0.1.0", path = "../domain" }
governor = "0.10.4"
realtime = { version = "0.1.0", path = "../realtime" }
storage = { version = "0.1.0", path = "../storage" }
reqwest = { version = "0.12.28", default-features = false, features = [
    "json",
    "rustls-tls",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["macros", "sync", "time"] }
tower_governor = "0.8.0"
tracing = "0.1.44"
uuid = { version = "1.24.1", features = ["serde"] }

[dev-dependencies]
auth = { version = "0.1.0", path = "../auth", features = ["test-support"] }
mailer = { version = "0.1.0", path = "../mailer" }
db = { path = "../db" }
futures-util = "0.3.34"
http = "1.5.0"
http-body-util = "0.1.5"
sqlx = { version = "0.9.0", features = ["postgres"] }
test-support = { version = "0.1.0", path = "../test-support" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time"] }
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }
