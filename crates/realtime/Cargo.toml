[package]
name = "realtime"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
app-core = { version = "0.1.0", path = "../core" }
chrono = { version = "0.4.45", features = ["serde", "clock"] }
domain = { version = "0.1.0", path = "../domain" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["sync"] }
tracing = "0.1.44"
uuid = { version = "1.24.1", features = ["serde"] }

[dev-dependencies]
app-core = { version = "0.1.0", path = "../core" }
auth = { version = "0.1.0", path = "../auth", features = ["test-support"] }
mailer = { version = "0.1.0", path = "../mailer" }
db = { version = "0.1.0", path = "../db" }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres"] }
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
