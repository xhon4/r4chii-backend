[package]
name = "storage"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
app-core = { version = "0.1.0", path = "../core" }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
rusty-s3 = "0.10.2"
thiserror = "2.0.20"

[dev-dependencies]
app-core = { version = "0.1.0", path = "../core" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
