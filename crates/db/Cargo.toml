[package]
name = "db"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
app-core = { version = "0.1.0", path = "../core" }
chrono = { version = "0.4.45", features = ["clock"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "migrate"] }
thiserror = "2.0.20"

[dev-dependencies]
test-support = { version = "0.1.0", path = "../test-support" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
