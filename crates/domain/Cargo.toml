[package]
name = "domain"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[dependencies]
app-core = { version = "0.1.0", path = "../core" }
auth = { version = "0.1.0", path = "../auth" }
chrono = { version = "0.4.45", features = ["serde", "clock"] }
db = { version = "0.1.0", path = "../db" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "rayon"] }
rand = "0.10.2"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono"] }
storage = { version = "0.1.0", path = "../storage" }
thiserror = "2.0.20"

[dev-dependencies]
auth = { version = "0.1.0", path = "../auth", features = ["test-support"] }
mailer = { version = "0.1.0", path = "../mailer" }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "bmp"] }
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
